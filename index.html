<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./src/styles/style.css">
  <title>GathSession | Proyecto CSS - Academía Conquer Blocks</title>
  <meta name="description" content="Meet and communicate with the best people to run projects, events or other activities">
  <link rel="shortcut icon" href="./icons/favicon.svg" type="image/x-icon">

</head>
<body>
  <header class="header-page">
    <div class="logo">
      <a href="#">Gath<span>Session</span>.</a>
    </div>
    <nav class="nav-header">
      <ul class="list-nav">
        <a href="#">Home</a>
        <a href="#">Feactures</a>
        <a href="#">Blog</a>
        <a href="#">Contact</a>
        <a href="#">About Us</a>
      </ul>
    </nav>
  </header>
  <main>
    <section class="container-hero">
      <section class="content-info">
        <h1>Build your best community starting from here.</h1>
        <p>Meet and communicate with the best people to run projects, events or other activities in a more effective and fun way</p>
        <div class="buttons">
          <button>Get Started</button>
          <button>Learn More <img src="./icons/arrow-right.svg" alt="icon arrow right"> </button>
        </div>

        <article>
          <div class="dd">
            <figure>
              <img src="./images/community-gath.webp" alt="Icon community">
            </figure>
            <p>Build Community</p>
          </div>
          <div class="dd">
            <figure>
              <img src="./images/events-gath.webp" alt="Icon events">
            </figure>
            <p>Share Events</p>
          </div>
          <div class="dd">
            <figure>
              <img src="./images/get-gath.webp" alt="Icon Information">
            </figure>
            <p>Get Information</p>
          </div>
        </article>
      </section>
      <section class="content-images">
        <figure class="user-purple">
          <img src="./images/person1-gath.webp" alt="Imagen de usuario 1">
        </figure>
        <figure class="user-pink">
          <img src="./images/person2-gath.webp" alt="Imagen de usuario 2">
        </figure>
        <figure class="user-cyan">
          <img src="./images/person3-gath.webp" alt="Imagen de usuario 3">
        </figure>
        <figure class="user-orange">
          <img src="./images/person4-gath.webp" alt="Imagen de usuario 4">
        </figure>
        <figure class="user-yellow">
          <img src="./images/person5-gath.webp" alt="Imagen de usuario 5">
        </figure>
      </section>
      <div class="circle-small"></div>
    </section>
    <div class="circle-big"></div>
  </main>
</body>
</html>
